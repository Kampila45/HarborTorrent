name: Release

# Triggers when a version tag is pushed: git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            dotnet-rid: linux-x64
            args: ''
          - platform: windows-latest
            dotnet-rid: win-x64
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        # actions/checkout@v4.2.2 — pinned to immutable SHA
        uses: actions/checkout@v4.2.2

      # ── 2. Check version consistency ─────────────────────────────────────────
      - name: Setup Node.js (for version check)
        # actions/setup-node@v4.4.0 — pinned to immutable SHA
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify version consistency across all components
        run: node scripts/check-versions.mjs
        working-directory: frontend

      # ── 3. Build .NET sidecar ─────────────────────────────────────────────
      - name: Setup .NET 10
        # actions/setup-dotnet@v4.3.1 — pinned to immutable SHA
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Publish .NET API sidecar
        shell: bash
        run: |
          dotnet publish backend/HarborTorrent.Api \
            --runtime ${{ matrix.dotnet-rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -c Release \
            -o frontend/src-tauri/binaries/
        env:
          # Embed the git commit SHA into the sidecar for traceability via /health.
          HARBOR_COMMIT_SHA: ${{ github.sha }}

      # ── 4. Rust setup ─────────────────────────────────────────────────────
      - name: Setup Rust
        # dtolnay/rust-toolchain@stable — pinned to immutable SHA
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        # swatinem/rust-cache@v2.7.8 — pinned to immutable SHA
        uses: swatinem/rust-cache@v2.7.8
        with:
          workspaces: frontend/src-tauri -> target

      # ── 5. Rename sidecar to match Tauri naming convention ────────────────
      - name: Rename sidecar binary
        run: node scripts/rename-sidecar.mjs
        working-directory: frontend

      # ── 6. Linux system dependencies (required by Tauri/WebKit) ──────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # ── 7. Build Tauri app & publish to GitHub Release ───────────────────
      - name: Build and release Tauri app
        # tauri-apps/tauri-action@v0.5.18 — pinned to immutable SHA
        uses: tauri-apps/tauri-action@v0.5.18
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'HarborTorrent ${{ github.ref_name }}'
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/backend/CHANGELOG.md) for full details.

            ---

            ### Installation
            | Platform | File |
            |---|---|
            | Windows x64 | `.msi` or `.exe` setup installer |
            | Linux x64 | `.AppImage` (portable), `.deb` (Debian/Ubuntu), or `.rpm` (Fedora/RHEL) |

            > **RPM installation:** `sudo rpm -i HarborTorrent-*.rpm` or `sudo dnf install ./HarborTorrent-*.rpm`

            > **Note:** HarborTorrent uses an embedded SQLite database. No database setup or server is required — just install and run!

            ---

            ### Verifying downloads
            SHA-256 checksums for all release assets are available in `checksums.sha256.txt`.
          releaseDraft: true
          prerelease: false

      # ── 8. Generate SHA-256 checksums for all release assets ─────────────
      - name: Generate SHA-256 checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          find frontend/src-tauri/target -maxdepth 4 \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec sha256sum {} \; >> checksums.sha256.txt || true

      - name: Generate SHA-256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path frontend\src-tauri\target -Recurse -Include "*.msi","*.exe","*.nsis" |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -Append checksums.sha256.txt
            }

      - name: Upload checksums to release
        if: hashFiles('checksums.sha256.txt') != ''
        # softprops/action-gh-release@v2.3.2 — pinned to immutable SHA
        uses: softprops/action-gh-release@v2.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: checksums.sha256.txt
          tag_name: ${{ github.ref_name }}

name: Release

# Triggers when a version tag is pushed: git tag v1.0.3 && git push origin v1.0.3
on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            dotnet-rid: linux-x64
            args: ''
          - platform: windows-latest
            dotnet-rid: win-x64
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # ── 2. Check version consistency ─────────────────────────────────────────
      - name: Setup Node.js (for version check)
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify version consistency across all components
        run: node scripts/check-versions.mjs
        working-directory: frontend

      # ── 3. Test and build .NET sidecar ─────────────────────────────────────
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Run backend tests
        run: dotnet test backend/HarborTorrent.slnx --configuration Release --verbosity normal

      - name: Publish .NET API sidecar
        shell: bash
        run: |
          dotnet publish backend/HarborTorrent.Api \
            --runtime ${{ matrix.dotnet-rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -c Release \
            -o frontend/src-tauri/binaries/
        env:
          # Embed the git commit SHA into the sidecar for traceability via /health.
          HARBOR_COMMIT_SHA: ${{ github.sha }}

      # ── 4. Rust setup ─────────────────────────────────────────────────────
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2.7.8
        with:
          workspaces: frontend/src-tauri -> target

      # ── 5. Rename sidecar to match Tauri naming convention ────────────────
      - name: Rename sidecar binary
        run: node scripts/rename-sidecar.mjs
        working-directory: frontend

      # ── 6. Linux system dependencies (required by Tauri/WebKit) ──────────
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      # ── 7. Build Tauri app & upload to draft GitHub Release ──────────────
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0.5.18
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: frontend
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'HarborTorrent ${{ github.ref_name }}'
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/backend/CHANGELOG.md) for full details.

            ---

            ### Installation
            | Platform | File |
            |---|---|
            | Windows x64 | `.msi` or `.exe` setup installer |
            | Linux x64 | `.AppImage` (portable), `.deb` (Debian/Ubuntu), or `.rpm` (Fedora/RHEL) |

            > **RPM installation:** `sudo rpm -i HarborTorrent-*.rpm` or `sudo dnf install ./HarborTorrent-*.rpm`

            > **Note:** HarborTorrent uses an embedded SQLite database. No database setup or server is required — just install and run!

            ---

            ### Verifying downloads
            SHA-256 checksums for all release assets are available in `checksums.sha256.txt`.
            To verify only the installer you downloaded:
            `sha256sum --ignore-missing --check checksums.sha256.txt`
          releaseDraft: true
          prerelease: false

      # ── 8. Stage distributable installers for combined checksum manifest ──
      - name: Stage release installers (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p staged-assets
          find frontend/src-tauri/target/release/bundle -maxdepth 3 -type f \
            \( -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \) \
            -exec cp -t staged-assets {} +
          ls -la staged-assets

      - name: Stage release installers (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staged-assets | Out-Null
          Get-ChildItem -Path frontend\src-tauri\target\release\bundle -Recurse -File -Include "*.msi","*.exe" |
            Copy-Item -Destination staged-assets
          Get-ChildItem staged-assets

      - name: Upload staged installers for checksum aggregation
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-assets-${{ matrix.dotnet-rid }}
          path: staged-assets/*
          if-no-files-found: error

  finalize-release:
    needs: build-and-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download all staged platform assets
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: release-assets-*
          path: staged-artifacts
          merge-multiple: false

      - name: Generate deterministic SHA-256 checksum manifest
        shell: bash
        run: |
          mkdir -p all-assets
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [ -e "all-assets/$base" ]; then
              echo "Error: Duplicate release asset filename detected: $base" >&2
              exit 1
            fi
            cp "$file" "all-assets/$base"
          done < <(find staged-artifacts -type f -print0)

          cd all-assets
          shopt -s nullglob
          files=(*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Error: No release assets found for checksum generation." >&2
            exit 1
          fi
          LC_ALL=C sha256sum "${files[@]}" > ../checksums.sha256.txt
          cd ..
          cat checksums.sha256.txt

      - name: Upload checksums and publish release
        uses: softprops/action-gh-release@v2.3.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: checksums.sha256.txt
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
